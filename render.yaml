# Render blueprint: C# API + heti OFF import cron (API hívás).
services:
  - type: web
    name: flexio-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health/ready
    envVars:
      - key: SupabaseAuth__ProjectUrl
        value: https://qbppiqfmhoaogyzaueix.supabase.co
      - key: Postgres__ApiConnectionString
        sync: false
      - key: Postgres__JobsConnectionString
        sync: false
      - key: InternalJobs__SharedSecret
        sync: false
      - key: Gemini__ApiKey
        sync: false
      - key: OpenFoodFacts__UserAgent
        value: "Flexio/1.0 (kapcsolat: hello@flexio.app)"
      - key: OpenFoodFacts__BatchSize
        value: "500"

  - type: cron
    name: flexio-off-import
    schedule: "0 3 * * 1"
    startCommand: >
      curl -sf -X POST
      -H "X-Flexio-Job-Secret: ${INTERNAL_JOBS__SHAREDSECRET}"
      https://flexio-api.onrender.com/internal/jobs/import-off
    envVars:
      - key: INTERNAL_JOBS__SHAREDSECRET
        sync: false
